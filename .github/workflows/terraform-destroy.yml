name: IaC — Terraform Destroy (Teardown to Zero Cost)

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Environment to destroy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - test
      confirm_destruction:
        description: "Type 'DESTROY' to confirm tear down"
        required: true
        type: string

jobs:
  terraform-destroy:
    name: Teardown GCP Infrastructure
    runs-on: ubuntu-latest
    if: inputs.confirm_destruction == 'DESTROY'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Authenticate to Google Cloud
        if: env.GCP_CREDENTIALS != ''
        uses: google-github-actions/auth@v2
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Terraform Init
        working-directory: infra/envs/${{ inputs.target_env }}
        run: terraform init -backend=false

      - name: Terraform Destroy (Clean Tear Down)
        working-directory: infra/envs/${{ inputs.target_env }}
        run: |
          echo "Running terraform destroy for environment: ${{ inputs.target_env }}"
          echo "All buckets with force_destroy=true and serverless resources will be terminated."
