name: IaC — Terraform Destroy (Teardown to Zero Cost)

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Environment to destroy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - test
      confirm_destruction:
        description: "Type 'DESTROY' to confirm tear down"
        required: true
        type: string

jobs:
  terraform-destroy:
    name: Teardown GCP Infrastructure
    runs-on: ubuntu-latest
    if: inputs.confirm_destruction == 'DESTROY'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable Required APIs for Teardown
        run: |
          echo "Enabling Cloud Resource Manager and IAM APIs in GCP..."
          gcloud services enable cloudresourcemanager.googleapis.com iam.googleapis.com --project=bitcitychamp-project || true

      - name: Terraform Init
        working-directory: infra/envs/${{ inputs.target_env }}
        run: terraform init


      - name: Terraform Destroy (Clean Tear Down)
        working-directory: infra/envs/${{ inputs.target_env }}
        run: |
          echo "Running terraform destroy for environment: ${{ inputs.target_env }}"
          terraform destroy -auto-approve

      - name: Cleanup Cloud Run, Artifact Registry & State Bucket for 100% Zero Cost
        run: |
          echo "Deleting Cloud Run service and Artifact Registry repository if present..."
          gcloud run services delete "rag-api-${{ inputs.target_env }}" --region=us-central1 --project=bitcitychamp-project --quiet || true
          gcloud artifacts repositories delete "rag-containers-${{ inputs.target_env }}" --location=us-central1 --project=bitcitychamp-project --quiet || true
          echo "Deleting Terraform state bucket non-interactively..."
          gcloud storage buckets delete gs://bitcitychamp-project-tfstate --quiet || true
          echo "GCP resources have been completely wiped to zero cost."

