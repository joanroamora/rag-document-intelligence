name: IaC — Terraform Apply (Deploy DEV Infrastructure)

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev

jobs:
  terraform-apply:
    name: Deploy GCP Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Ensure Remote State Bucket Exists
        run: |
          if ! gcloud storage buckets describe gs://bitcitychamp-project-tfstate >/dev/null 2>&1; then
            echo "Creating Terraform state bucket..."
            gcloud storage buckets create gs://bitcitychamp-project-tfstate --project=bitcitychamp-project --location=us-central1 --uniform-bucket-level-access
          else
            echo "Terraform state bucket already exists."
          fi

      - name: Terraform Init
        working-directory: infra/envs/${{ inputs.target_env }}
        run: terraform init

      - name: Terraform Plan
        working-directory: infra/envs/${{ inputs.target_env }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: infra/envs/${{ inputs.target_env }}
        run: terraform apply -auto-approve tfplan
