name: CD — Deploy RAG Service & UI to Cloud Run (DEV)

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      use_live_gemini:
        description: "Enable live Gemini Free Tier API calls (true/false)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  deploy-cloud-run-dev:
    name: Build Container & Deploy to Cloud Run (DEV)
    runs-on: ubuntu-latest
    env:
      GCP_REGION: "us-central1"
      AR_REPO: "rag-containers-dev"
      SERVICE_NAME: "rag-api-dev"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable Cloud Run & Artifact Registry APIs and ensure repository exists
        run: |
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          PROJECT_ID="${PROJECT_ID:-bitcitychamp-project}"
          echo "RESOLVED_PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          gcloud config set project "$PROJECT_ID"
          gcloud services enable artifactregistry.googleapis.com run.googleapis.com --project="$PROJECT_ID"
          if ! gcloud artifacts repositories describe "$AR_REPO" --location="$GCP_REGION" --project="$PROJECT_ID" >/dev/null 2>&1; then
            gcloud artifacts repositories create "$AR_REPO" \
              --repository-format=docker \
              --location="$GCP_REGION" \
              --project="$PROJECT_ID" \
              --description="RAG Platform container repository (DEV)"
          fi
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and Push Immutable Container Image
        run: |
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${RESOLVED_PROJECT_ID}/${AR_REPO}/rag-api:${{ github.sha }}"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          DIGEST=$(gcloud artifacts docker images describe "$IMAGE_URI" --format='get(image_summary.digest)')
          echo "IMMUTABLE_IMAGE=${GCP_REGION}-docker.pkg.dev/${RESOLVED_PROJECT_ID}/${AR_REPO}/rag-api@${DIGEST}" >> "$GITHUB_ENV"

      - name: Configure Cloud Run Runtime Service Account and Permissions
        run: |
          RUN_SA="rag-worker-dev@${RESOLVED_PROJECT_ID}.iam.gserviceaccount.com"
          if ! gcloud iam service-accounts describe "$RUN_SA" --project="$RESOLVED_PROJECT_ID" >/dev/null 2>&1; then
            echo "Creating dedicated runtime service account $RUN_SA..."
            gcloud iam service-accounts create "rag-worker-dev" \
              --display-name="RAG Worker Runtime Service Account" \
              --project="$RESOLVED_PROJECT_ID"
          fi
          echo "RUN_SA=$RUN_SA" >> "$GITHUB_ENV"

          GHA_SA="github-actions-sa@${RESOLVED_PROJECT_ID}.iam.gserviceaccount.com"
          echo "Authorizing $GHA_SA to act as $RUN_SA (roles/iam.serviceAccountUser)..."
          gcloud iam service-accounts add-iam-policy-binding "$RUN_SA" \
            --member="serviceAccount:${GHA_SA}" \
            --role="roles/iam.serviceAccountUser" \
            --project="$RESOLVED_PROJECT_ID" --quiet || true

          # Grant Storage Object Admin to runtime SA so it can access document buckets
          gcloud projects add-iam-policy-binding "$RESOLVED_PROJECT_ID" \
            --member="serviceAccount:${RUN_SA}" \
            --role="roles/storage.objectAdmin" --quiet || true

          # Also grant roles/iam.serviceAccountUser on default compute SA
          PROJECT_NUM=$(gcloud projects describe "$RESOLVED_PROJECT_ID" --format='value(projectNumber)')
          gcloud iam service-accounts add-iam-policy-binding "${PROJECT_NUM}-compute@developer.gserviceaccount.com" \
            --member="serviceAccount:${GHA_SA}" \
            --role="roles/iam.serviceAccountUser" \
            --project="$RESOLVED_PROJECT_ID" --quiet || true

      - name: Deploy Service to Cloud Run (Scale-to-Zero Free Tier Friendly)
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --image="$IMMUTABLE_IMAGE" \
            --service-account="$RUN_SA" \
            --region="$GCP_REGION" \
            --project="$RESOLVED_PROJECT_ID" \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=2 \
            --cpu=1 \
            --memory=512Mi \
            --set-env-vars="ENVIRONMENT=dev,USE_LIVE_GEMINI_API=${{ inputs.use_live_gemini || 'false' }},GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},GCS_DOCUMENTS_BUCKET=${RESOLVED_PROJECT_ID}-rag-documents-dev"

      - name: Output Cloud Run Live URL
        run: |
          SERVICE_URL=$(gcloud run services describe "$SERVICE_NAME" --region="$GCP_REGION" --project="$RESOLVED_PROJECT_ID" --format='value(status.url)')
          echo "### 🚀 AETHER RAG Enterprise UI Deployed!" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Live Console URL:** $SERVICE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Health Endpoint:** ${SERVICE_URL}/health" >> "$GITHUB_STEP_SUMMARY"
          echo "- **OpenAPI Docs:** ${SERVICE_URL}/docs" >> "$GITHUB_STEP_SUMMARY"
          echo "Live URL: $SERVICE_URL"
