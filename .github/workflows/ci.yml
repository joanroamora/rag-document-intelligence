name: CI — Governance, Lint & Contract Tests

on:
  push:
    branches:
      - main
      - dev
      - "Feature*"
  pull_request:
    branches:
      - main
      - dev

jobs:
  commit-governance:
    name: Validate Feature Commit Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Enforce Feature<N>: commit prefix
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "Checking commit subject: $COMMIT_MSG"
          if [[ "$COMMIT_MSG" =~ ^Merge\  ]]; then
            echo "Merge commit detected — allowed."
            exit 0
          fi
          if [[ ! "$COMMIT_MSG" =~ ^Feature[0-9]+:\ .+ ]]; then
            echo "::error::Commit message must start with 'Feature<N>: <description>' (e.g. 'Feature1: Updating ci pipeline'). Got: '$COMMIT_MSG'"
            exit 1
          fi
          echo "Commit format verified successfully."

  lint-and-test:
    name: Python Lint (Ruff) & Unit Tests (Pytest)
    runs-on: ubuntu-latest
    needs: commit-governance
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and dev dependencies in cloud runner
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: ruff check src tests

      - name: Run Unit & Contract Tests with Coverage
        run: pytest -v --cov=rag_platform --cov-report=term-missing
